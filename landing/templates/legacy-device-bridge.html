<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<title></title>
<script>
(function () {
  var id = '';
  try { id = localStorage.getItem('rs_device_id') || ''; } catch (_) {}
  var msg = { type: 'rs-legacy-device', id: id };
  // targetOrigin '*' — родитель сам сверит event.origin со старым хостом.
  // apex и www оба валидны как parent, один конкретный origin тут не угадать.
  try {
    if (window.parent && window.parent !== window) {
      window.parent.postMessage(msg, '*');
    }
  } catch (_) {}
})();
</script>
</head>
<body></body>
</html>
