name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        # версии бота — как в Dockerfile
        run: pip install aiogram==3.14.0 aiohttp==3.10.11 redis==5.0.7 pytest pytest-asyncio ruff==0.15.16
      - name: Ruff
        run: ruff check .
      - name: Compile
        run: python -m compileall -q .
      - name: Tests
        run: python -m pytest -q
